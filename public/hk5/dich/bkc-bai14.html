<!DOCTYPE html>
<html lang="vi">
  <head>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
<h1>✍️ Dịch Việt sang Trung</h1>
<div id="start" class="card">
<p>Game hiện câu tiếng Việt, bạn gõ lại bằng chữ Hán (dùng bàn phím tiếng Trung/pinyin). Không cần gõ dấu câu. Bấm “Gợi ý” để xem chữ Hán, pinyin và nghĩa tiếng Việt.</p>
<label><input type="checkbox" id="shuf"> Xáo trộn thứ tự câu</label>
<p><button id="go">Bắt đầu</button></p>
</div>
<div id="game" class="hide">
<div class="card">
<div class="row"><span id="pos" class="mut"></span><span id="sc" class="mut"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="vi" id="vi"></div>
<textarea id="in" placeholder="Gõ chữ Hán vào đây..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<div class="row" style="margin-top:12px"><button id="ck">Kiểm tra</button><button id="hint" class="alt">Gợi ý</button><button id="skip" class="alt">Bỏ qua</button></div>
<div id="out"></div>
</div>
</div>
<div id="end" class="card hide"></div>
</main>
<script>
var S=[
["星期天，我和麦克一起骑车到图书城去买书。","Xīngqītiān, wǒ hé Màikè yìqǐ qí chē dào túshūchéng qù mǎi shū."],
["图书城离我们学校比较远。","Túshūchéng lí wǒmen xuéxiào bǐjiào yuǎn."],

["看到书店里有各种各样的书，我很兴奋。","Kàndào shūdiàn li yǒu gèzhǒnggèyàng de shū, wǒ hěn xīngfèn."],
["从这个书架上拿下来一本看看，再放上去，又从另一个书架上抽出来一本看看。","Cóng zhè ge shūjià shàng ná xiàlái yì běn kànkan, zài fàng shàngqù, yòu cóng lìng yí ge shūjià shàng chōu chūlái yì běn kànkan."],
["我挑了几本历史书，麦克选了一些中文小说儿。","Wǒ tiāo le jǐ běn lìshǐ shū, Màikè xuǎn le yìxiē Zhōngwén xiǎoshuōr."],
["快放寒假了，我们都想买一些书带回国去。","Kuài fàng hánjià le, wǒmen dōu xiǎng mǎi yìxiē shū dài huíguó qù."],
["除了买书以外，我们还想买一些小礼品，带回去送朋友。","Chúle mǎi shū yǐwài, wǒmen hái xiǎng mǎi yìxiē xiǎo lǐpǐn, dài huíqù sòng péngyou."],

["我买了一些京剧脸谱的小饰物，还买了一些丝织品。","Wǒ mǎi le yìxiē Jīngjù liǎnpǔ de xiǎo shìwù, hái mǎi le yìxiē sīzhīpǐn."],
["麦克买了很多漂亮的钥匙链儿，还买了不少小玩具，有小熊猫、小汽车什么的。","Màikè mǎi le hěn duō piàoliang de yàoshi liànr, hái mǎi le bù shǎo xiǎo wánjù, yǒu xiǎo xióngmāo, xiǎo qìchē shénme de."],
["他说，这些玩具带回去送给小朋友们，他们肯定喜欢。","Tā shuō, zhèxiē wánjù dài huíqù sònggěi xiǎopéngyǒumen, tāmen kěndìng xǐhuan."],
["售货员看我们买的东西多，不好拿，就给我们一人找了一个小纸箱。","Shòuhuòyuán kàn wǒmen mǎi de dōngxi duō, bù hǎo ná, jiù gěi wǒmen yì rén zhǎo le yí ge xiǎo zhǐxiāng."],
["我们买的书和礼品正好都能放进去。","Wǒmen mǎi de shū hé lǐpǐn zhènghǎo dōu néng fàngjìnqù."],
["从商场出来，已经十二点多了。","Cóng shāngchǎng chūlái, yǐjīng shí’èr diǎn duō le."],
["我和麦克走进一个小饭馆儿去吃午饭。","Wǒ hé Màikè zǒujìn yí ge xiǎo fànguǎnr qù chī wǔfàn."],
["我们要了一盘饺子和几个菜，吃得很舒服。","Wǒmen yào le yì pán jiǎozi hé jǐ ge cài, chī de hěn shūfu."],
["吃完饭，我们就骑车回来了。","Chīwán fàn, wǒmen jiù qí chē huílái le."],
["回到学校，我又累又困，想赶快回到宿舍去洗个澡，休息休息。","Huídào xuéxiào, wǒ yòu lèi yòu kùn, xiǎng gǎnkuài huídào sùshè qù xǐ ge zǎo, xiūxi xiūxi."],
["我从车上拿下小纸箱。","Wǒ cóng chē shàng ná xià xiǎo zhǐxiāng."],
["走进楼来，看见电梯门口贴了张通知：“电梯维修，请走楼梯。”","Zǒujìn lóu lái, kànjiàn diàntī ménkǒu tiē le zhāng tōngzhī: “Diàntī wéixiū, qǐng zǒu lóutī.”"],
["我住十层，没办法，只好爬上去。","Wǒ zhù shí céng, méi bànfǎ, zhǐhǎo pá shàngqù."],
["我手里提着一箱子东西，一步一步地往上爬。","Wǒ shǒu li tí zhe yì xiāngzi dōngxi, yí bù yí bù de wǎng shàng pá."],
["爬了半天才爬到十层。","Pá le bàntiān cái pádào shí céng."],
["到了门口，我放下箱子，要拿出钥匙开门的时候，却发现钥匙不见了，找了半天也没有找到。","Dào le ménkǒu, wǒ fàngxià xiāngzi, yào náchū yàoshi kāi mén de shíhou, què fāxiàn yàoshi bú jiàn le, zhǎo le bàntiān yě méiyǒu zhǎodào."],
["啊！我忽然想起来了，钥匙还在楼下自行车上插着呢，我忘拔下来了。","À! Wǒ hūrán xiǎng qǐlái le, yàoshi hái zài lóu xià zìxíngchē shàng chā zhe ne, wǒ wàng bá xiàlái le."],
["这时，我真是哭笑不得。","Zhè shí, wǒ zhēn shì kūxiàobùdé."],
["我刚要跑下楼去，就看见麦克也爬上来了，他手里拿的正是我的那串儿钥匙。","Wǒ gāng yào pǎo xià lóu qù, jiù kànjiàn Màikè yě pá shànglái le, tā shǒu li ná de zhèng shì wǒ de nà chuànr yàoshi."]
];
var V=[
"Chủ nhật, tôi và Mike cùng đạp xe đến Thành phố Sách để mua sách.",
"Thành phố Sách cách trường chúng tôi khá xa.",
"Hôm đó có gió, chúng tôi đạp hơn một tiếng đồng hồ mới đến nơi.",
"Thành phố Sách rất lớn, bên trong có rất nhiều hiệu sách.",
"Hiệu sách nào chúng tôi cũng muốn vào xem thử.",
"Chúng tôi từ hiệu sách này đi ra, lại bước vào một hiệu sách khác.",
"Thấy trong hiệu sách có đủ loại sách, tôi rất phấn khích.",
"Lấy một quyển từ giá sách này xuống xem, rồi lại đặt lên, lại rút một quyển từ giá sách khác ra xem.",
"Tôi chọn mấy quyển sách lịch sử, Mike chọn một số tiểu thuyết tiếng Trung.",
"Sắp nghỉ đông rồi, chúng tôi đều muốn mua một ít sách mang về nước.",
"Ngoài mua sách ra, chúng tôi còn muốn mua một ít quà nhỏ, mang về tặng bạn bè.",
"Thế là chúng tôi lại đi vào một trung tâm thương mại.",
"Trung tâm thương mại này cái gì cũng có.",
"Tôi mua một ít đồ trang trí nhỏ hình mặt nạ Kinh kịch, còn mua một ít hàng tơ lụa.",
"Mike mua rất nhiều móc chìa khóa đẹp, còn mua không ít đồ chơi nhỏ, có gấu trúc nhỏ, ô tô nhỏ v.v.",
"Cậu ấy nói, những món đồ chơi này mang về tặng các em nhỏ, các em chắc chắn sẽ thích.",
"Nhân viên bán hàng thấy chúng tôi mua nhiều đồ, khó cầm, liền tìm cho mỗi người một thùng giấy nhỏ.",
"Sách và quà chúng tôi mua vừa vặn đều bỏ vừa vào trong.",
"Từ trung tâm thương mại đi ra, đã hơn mười hai giờ rồi.",
"Tôi và Mike vào một quán ăn nhỏ để ăn trưa.",
"Chúng tôi gọi một đĩa sủi cảo và mấy món, ăn rất thoải mái.",
"Ăn cơm xong, chúng tôi đạp xe về.",
"Về đến trường, tôi vừa mệt vừa buồn ngủ, muốn nhanh chóng về ký túc xá tắm một cái, nghỉ ngơi một chút.",
"Tôi lấy thùng giấy nhỏ từ trên xe xuống.",
"Bước vào tòa nhà, thấy trước cửa thang máy dán một tờ thông báo: “Thang máy đang sửa chữa, xin đi cầu thang bộ.”",
"Tôi ở tầng mười, hết cách, đành phải leo lên.",
"Tay tôi xách một thùng đồ, từng bước từng bước leo lên.",
"Leo mãi mới lên đến tầng mười.",
"Đến trước cửa, tôi đặt thùng xuống, lúc định lấy chìa khóa ra mở cửa thì lại phát hiện chìa khóa không thấy đâu, tìm mãi cũng không thấy.",
"Á! Tôi chợt nhớ ra rồi, chìa khóa vẫn còn cắm trên xe đạp dưới lầu, tôi quên rút ra.",
"Lúc này, tôi thật là dở khóc dở cười.",
"Tôi vừa định chạy xuống lầu thì thấy Mike cũng leo lên rồi, thứ cậu ấy cầm trong tay chính là chùm chìa khóa của tôi."
];
S.forEach(function(s,k){s[2]=V[k]});
var $=function(x){return document.getElementById(x)};
var Q=[],i=0,ok=0,done=false,wrong=[],hinted=false;
function han(s){return (s.match(/[\u4e00-\u9fff]/g)||[]).join("")}
function mark(a,b){
 var n=a.length,m=b.length,d=[],x,y;
 for(x=0;x<=n;x++)d.push(new Array(m+1).fill(0));
 for(x=n-1;x>=0;x--)for(y=m-1;y>=0;y--)d[x][y]=a[x]===b[y]?d[x+1][y+1]+1:Math.max(d[x+1][y],d[x][y+1]);
 var r=[],p=0,q=0;
 while(p<n&&q<m){if(a[p]===b[q]){r[p]=1;p++;q++}else if(d[p+1][q]>=d[p][q+1])p++;else q++}
 return r;
}
function card(q){return '<div class="zh">'+q[0]+'</div><div class="py">'+q[1]+'</div><div style="margin-top:4px">'+q[2]+'</div>'}
function show(){
 done=false;hinted=false;$("out").innerHTML="";$("in").value="";$("in").disabled=false;
 $("ck").textContent="Kiểm tra";$("vi").textContent=Q[i][2];
 $("pos").textContent="Câu "+(i+1)+"/"+Q.length;$("sc").textContent="Đúng: "+ok;
 $("pb").style.width=(i/Q.length*100)+"%";$("in").focus();
}
function reveal(good,msg,mine){
 done=true;$("in").disabled=true;$("ck").textContent=i==Q.length-1?"Xem kết quả":"Câu tiếp";
 $("out").innerHTML='<div class="res '+(good?"ok":"no")+'"><div class="'+(good?"good":"bad")+'">'+msg+'</div>'+(mine||"")+'<div style="margin-top:8px">'+card(Q[i])+'</div></div>';
}
function check(){
 if(done){i++;if(i>=Q.length)finish();else show();return}
 var a=han($("in").value),b=han(Q[i][0]);
 if(!a)return;
 if(a===b){
  if(hinted)wrong.push(Q[i]);else ok++;
  $("sc").textContent="Đúng: "+ok;
  reveal(true,hinted?"✓ Đúng (có dùng gợi ý nên câu này sẽ được luyện lại)":"✓ Chính xác!");
 }else{
  var r=mark(a,b),h="";
  for(var k=0;k<a.length;k++)h+='<span class="'+(r[k]?"good":"bad")+'">'+a[k]+'</span>';
  wrong.push(Q[i]);
  reveal(false,"✗ Chưa đúng (chữ đỏ là chữ sai hoặc thừa)",'<div class="zh">'+h+'</div>');
 }
}
function finish(){
 $("game").classList.add("hide");$("end").classList.remove("hide");
 $("end").innerHTML='<h2>Kết quả: '+ok+'/'+Q.length+'</h2>'+(wrong.length?'<p class="mut">Câu cần luyện lại: '+wrong.length+'</p><button id="re">Luyện lại câu sai</button> ':'<p class="good">Tuyệt vời, bạn đúng hết!</p>')+'<button class="alt" id="all">Chơi lại từ đầu</button>';
 if($("re"))$("re").onclick=function(){begin(wrong.slice(),false)};
 $("all").onclick=function(){begin(S.slice(),$("shuf").checked)};
}
function begin(list,sh){
 Q=list;if(sh)Q.sort(function(){return Math.random()-.5});
 i=0;ok=0;wrong=[];
 $("start").classList.add("hide");$("end").classList.add("hide");$("game").classList.remove("hide");show();
}
$("go").onclick=function(){begin(S.slice(),$("shuf").checked)};
$("ck").onclick=check;
$("skip").onclick=function(){if(done){check();return}wrong.push(Q[i]);reveal(false,"Đã bỏ qua")};
$("hint").onclick=function(){if(done)return;hinted=true;$("out").innerHTML='<div class="res">'+card(Q[i])+'</div>'};
document.addEventListener("keydown",function(e){
 if(e.isComposing||e.keyCode===229)return;
 if(e.key==="Enter"&&!e.shiftKey&&!$("game").classList.contains("hide")){e.preventDefault();check()}
});
</script>
</body>
</html>
