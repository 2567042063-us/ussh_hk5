<script>
const T9=[["屋子里太热，你想请服务员打开空调，怎么说？", "Wūzi li tài rè, nǐ xiǎng qǐng fúwùyuán dǎkāi kōngtiáo, zěnme shuō?", "Trong phòng nóng quá, bạn muốn nhờ nhân viên bật điều hòa, nói thế nào?", ["请你把空调打开。", "Qǐng nǐ bǎ kōngtiáo dǎkāi.", "Nhờ anh bật điều hòa lên."]], ["老师要你把作业本给他，你还没有做完，怎么对老师说？", "Lǎoshī yào nǐ bǎ zuòyèběn gěi tā, nǐ hái méiyǒu zuò wán, zěnme duì lǎoshī shuō?", "Thầy bảo bạn nộp vở bài tập, bạn chưa làm xong, nói với thầy thế nào?", ["老师，对不起，我还没把作业做完。", "Lǎoshī, duìbuqǐ, wǒ hái méi bǎ zuòyè zuò wán.", "Thưa thầy, em xin lỗi, em chưa làm xong bài tập."]], ["你去银行换钱，营业员问你换什么钱，你怎么说？", "Nǐ qù yínháng huàn qián, yíngyèyuán wèn nǐ huàn shénme qián, nǐ zěnme shuō?", "Bạn đi ngân hàng đổi tiền, nhân viên hỏi đổi loại tiền nào, bạn nói thế nào?", ["我想把美元换成人民币。", "Wǒ xiǎng bǎ Měiyuán huàn chéng rénmínbì.", "Tôi muốn đổi đô la Mỹ thành nhân dân tệ."]], ["在火车上，一位老人想把他的手提包放在行李架上，但他自己不能放上去，你要帮助他，怎么说？", "Zài huǒchē shang, yí wèi lǎorén xiǎng bǎ tā de shǒutíbāo fàng zài xínglijià shang, dàn tā zìjǐ bù néng fàng shàngqù, nǐ yào bāngzhù tā, zěnme shuō?", "Trên tàu, một cụ già muốn để túi xách lên giá hành lý nhưng không với tới, bạn giúp cụ, nói thế nào?", ["我帮您把包放在行李架上吧。", "Wǒ bāng nín bǎ bāo fàng zài xínglijià shang ba.", "Để cháu giúp bác đặt túi lên giá hành lý nhé."]]],T10=[["下班以后，天都快黑<span class=\"bl\" data-n=\"①\" data-a=\"下来\">①＿＿</span>，我想顺便买点儿菜带回家，就向一个菜摊儿走去。卖菜的是一个小伙子。问了价钱以后，我拿起一把菜，对他说：“<span class=\"bl\" data-n=\"②\" data-a=\"把\">②＿＿</span>这些菜给我称一下儿。”", "Xiàbān yǐhòu, tiān dōu kuài hēi xiàlái, wǒ xiǎng shùnbiàn mǎi diǎnr cài dài huíjiā, jiù xiàng yí ge càitānr zǒu qù. Mài cài de shì yí ge xiǎohuǒzi. Wèn le jiàqián yǐhòu, wǒ ná qǐ yì bǎ cài, duì tā shuō: “Bǎ zhèxiē cài gěi wǒ chēng yíxiàr.”", "Tan làm, trời sắp tối, tôi định tiện đường mua ít rau mang về nhà, bèn đi về phía một sạp rau. Người bán là một chàng trai. Hỏi giá xong, tôi cầm lên một bó rau, nói: “Cân giúp tôi chỗ rau này một chút.”"], ["“您给3块吧！”他称了以后说。", "“Nín gěi sān kuài ba!” Tā chēng le yǐhòu shuō.", "“Bác đưa 3 tệ đi!” Anh ấy cân xong nói."], ["“给，找吧。”我给了他一张10块的钱。", "“Gěi, zhǎo ba.” Wǒ gěi le tā yì zhāng shí kuài de qián.", "“Đây, thối đi.” Tôi đưa anh một tờ 10 tệ."], ["“您没零钱吗？”他问。“没有了，就这一张。”", "“Nín méi língqián ma?” Tā wèn. “Méiyǒu le, jiù zhè yì zhāng.”", "“Bác không có tiền lẻ ạ?” anh hỏi. “Không có, chỉ có tờ này.”"], ["他找了半天，才把一把零钱放<span class=\"bl\" data-n=\"③\" data-a=\"在\">③＿＿</span>我手里说：“您数一数吧。”", "Tā zhǎo le bàntiān, cái bǎ yì bǎ língqián fàng zài wǒ shǒu li shuō: “Nín shǔ yi shǔ ba.”", "Anh ấy tìm mãi mới đặt một nắm tiền lẻ vào tay tôi, nói: “Bác đếm thử đi.”"], ["我接过钱没有数，往口袋里一塞，拿起菜，骑上车就走了。", "Wǒ jiē guo qián méiyǒu shǔ, wǎng kǒudài li yì sāi, ná qǐ cài, qí shàng chē jiù zǒu le.", "Tôi nhận tiền không đếm, nhét vào túi, cầm rau, lên xe đi luôn."], ["骑了一会儿，我忽然觉得不对，就想，他找了我多少钱啊，我从车上下<span class=\"bl\" data-n=\"④\" data-a=\"来\">④＿＿</span>。从口袋里把钱拿出来认真地数<span class=\"bl\" data-n=\"⑤\" data-a=\"一\">⑤＿＿</span>数，小伙子找我了97块，多找给我90块钱！", "Qí le yíhuìr, wǒ hūrán juéde bú duì, jiù xiǎng, tā zhǎo le wǒ duōshao qián a, wǒ cóng chē shang xià lái. Cóng kǒudài li bǎ qián ná chūlái rènzhēn de shǔ yi shǔ, xiǎohuǒzi zhǎo wǒ le jiǔshíqī kuài, duō zhǎo gěi wǒ jiǔshí kuài qián!", "Đi một lúc, tôi chợt thấy không ổn, nghĩ: anh ấy thối cho mình bao nhiêu nhỉ, bèn xuống xe. Lấy tiền trong túi ra đếm cẩn thận, chàng trai thối cho tôi 97 tệ, thối dư tận 90 tệ!"], ["还回去不回去呢？已经走这么远了……", "Hái huíqù bù huíqù ne? Yǐjīng zǒu zhème yuǎn le……", "Có quay lại không đây? Đã đi xa thế này rồi……"], ["就在我这么想的时候，脸上马上觉得发热。我怎么会有这种不好的想法，我的心变坏了吗？", "Jiù zài wǒ zhème xiǎng de shíhou, liǎn shang mǎshàng juéde fārè. Wǒ zěnme huì yǒu zhè zhǒng bù hǎo de xiǎngfǎ, wǒ de xīn biàn huài le ma?", "Đúng lúc đang nghĩ vậy, mặt tôi nóng bừng. Sao mình lại có ý nghĩ xấu thế, lòng mình hư rồi sao?"], ["想到这儿，就立刻骑上车回去找那个卖菜的小伙子。", "Xiǎng dào zhèr, jiù lìkè qí shàng chē huíqù zhǎo nà ge mài cài de xiǎohuǒzi.", "Nghĩ đến đây, tôi lập tức đạp xe quay lại tìm chàng trai bán rau."], ["天已经黑了。我远远看见那个小伙子正准备走，就跑过去<span class=\"bl\" data-n=\"⑥\" data-a=\"把\">⑥＿＿</span>他叫住：“喂，等一下儿！”", "Tiān yǐjīng hēi le. Wǒ yuǎnyuǎn kànjiàn nà ge xiǎohuǒzi zhèng zhǔnbèi zǒu, jiù pǎo guòqù bǎ tā jiàozhù: “Wèi, děng yíxiàr!”", "Trời đã tối. Từ xa tôi thấy chàng trai đang chuẩn bị đi, liền chạy tới gọi lại: “Này, đợi một chút!”"], ["“怎么了？”小伙子问我。“你把钱找错了。”“少找了吗？”“不，你多找了。”“不会吧？”", "“Zěnme le?” Xiǎohuǒzi wèn wǒ. “Nǐ bǎ qián zhǎo cuò le.” “Shǎo zhǎo le ma?” “Bù, nǐ duō zhǎo le.” “Bú huì ba?”", "“Sao thế?” chàng trai hỏi. “Anh thối nhầm tiền rồi.” “Thối thiếu ạ?” “Không, anh thối dư.” “Không thể nào?”"], ["“怎么不会呢？你把我给你的10块钱看<span class=\"bl\" data-n=\"⑦\" data-a=\"成\">⑦＿＿</span>100块的了。”", "“Zěnme bú huì ne? Nǐ bǎ wǒ gěi nǐ de shí kuài qián kàn chéng yìbǎi kuài de le.”", "“Sao lại không? Anh coi tờ 10 tệ tôi đưa thành tờ 100 tệ rồi.”"], ["我说，“给，这是你多找的90块钱。”我把多找的钱还给了他。", "Wǒ shuō, “Gěi, zhè shì nǐ duō zhǎo de jiǔshí kuài qián.” Wǒ bǎ duō zhǎo de qián huán gěi le tā.", "Tôi nói: “Đây, 90 tệ anh thối dư.” Tôi trả lại số tiền thối dư cho anh."], ["他有点儿不太相信地把钱接过<span class=\"bl\" data-n=\"⑧\" data-a=\"来\">⑧＿＿</span>，很快，就感激地对我说：“谢谢了！大哥，谢谢你了！你真是好人。”", "Tā yǒudiǎnr bú tài xiāngxìn de bǎ qián jiē guòlái, hěn kuài, jiù gǎnjī de duì wǒ shuō: “Xièxie le! Dàgē, xièxie nǐ le! Nǐ zhēn shì hǎorén.”", "Anh ấy hơi không dám tin nhận lại tiền, rất nhanh sau đó cảm kích nói: “Cảm ơn! Anh cả, cảm ơn anh! Anh đúng là người tốt.”"], ["我没有说话，骑上车就走了。这时，我心里才觉得轻松了。", "Wǒ méiyǒu shuōhuà, qí shàng chē jiù zǒu le. Zhèshí, wǒ xīn li cái juéde qīngsōng le.", "Tôi không nói gì, lên xe đi. Lúc này trong lòng mới thấy nhẹ nhõm."], ["（注：这个故事发生在上个世纪80年代，当时的10元人民币与100元的色调差不多。）", "(Zhù: zhège gùshi fāshēng zài shàng ge shìjì bāshí niándài, dāngshí de shí yuán rénmínbì yǔ yìbǎi yuán de sèdiào chàbuduō.)", "(Chú thích: chuyện xảy ra vào những năm 1980, khi đó tờ 10 tệ và tờ 100 tệ có màu sắc gần giống nhau.)"]],T11=[["<span class=\"spk\">经理：</span>请把这份说明书翻译一下儿。", "Jīnglǐ: Qǐng bǎ zhè fèn shuōmíngshū fānyì yíxiàr.", "Giám đốc: Nhờ cô dịch bản hướng dẫn này một chút."], ["<span class=\"spk\">秘书：</span>翻译成英文的吗？", "Mìshū: Fānyì chéng Yīngwén de ma?", "Thư ký: Dịch sang tiếng Anh ạ?"], ["<span class=\"spk\">经理：</span>对。", "Jīnglǐ: Duì.", "Giám đốc: Đúng."], ["<span class=\"spk\">秘书：</span>什么时候要？", "Mìshū: Shénme shíhou yào?", "Thư ký: Khi nào cần ạ?"], ["<span class=\"spk\">经理：</span>下午能翻译完吗？", "Jīnglǐ: Xiàwǔ néng fānyì wán ma?", "Giám đốc: Chiều dịch xong được không?"], ["<span class=\"spk\">秘书：</span>能。", "Mìshū: Néng.", "Thư ký: Được ạ."], ["<span class=\"spk\">经理：</span>下午交给我吧。", "Jīnglǐ: Xiàwǔ jiāo gěi wǒ ba.", "Giám đốc: Chiều đưa cho tôi nhé."], ["<span class=\"spk\">秘书：</span>好。", "Mìshū: Hǎo.", "Thư ký: Vâng."]];
const VG="<div class=\"vg\"><div><b>摊儿</b>tānr · quầy, sạp</div><div><b>价钱</b>jiàqián · giá tiền</div><div><b>称</b>chēng · cân</div><div><b>零钱</b>língqián · tiền lẻ</div><div><b>塞</b>sāi · nhét, giúi</div><div><b>相信</b>xiāngxìn · tin tưởng</div><div><b>感激</b>gǎnjī · cảm kích, biết ơn</div><div><b>轻松</b>qīngsōng · nhẹ nhõm</div></div>";
function row(r){const a=r[3];return '<div class="s"><div class="h">'+r[0]+'</div><div class="p">'+r[1]+'</div><div class="v">'+r[2]+'</div>'+(a?'<button class="chip mini">Gợi ý đáp án (câu chữ 把)</button><div class="a"><div class="h">'+a[0]+'</div><div class="p">'+a[1]+'</div><div class="v">'+a[2]+'</div></div>':'')+'</div>'}
function mk(id,arr,pre,post){const p=document.getElementById(id);
p.innerHTML=(pre||'')+'<div class="tools"><button class="chip" data-k="showp">Pinyin</button><button class="chip" data-k="showv">Nghĩa</button></div><div class="list">'+arr.map(row).join('')+'</div><div class="note" style="margin-top:8px">'+(post||'Chạm vào câu để xem pinyin và nghĩa.')+'</div>';
p.querySelectorAll('.s').forEach(s=>s.onclick=()=>{const on=!s.classList.contains('sp');s.classList.toggle('sp',on);s.classList.toggle('sv',on)});
p.querySelectorAll('.mini').forEach(b=>b.onclick=e=>{e.stopPropagation();b.parentNode.classList.toggle('sa')});
p.querySelectorAll('.tools .chip').forEach(c=>c.onclick=()=>{c.classList.toggle('on');p.classList.toggle(c.dataset.k)})}
mk('a',T9,'<div class="note" style="margin-bottom:8px">Bạn nói thế nào trong các tình huống sau (dùng câu chữ 把)? Tự nghĩ rồi bấm “Gợi ý đáp án”.</div>','Đáp án chỉ là gợi ý tự soạn, không phải đáp án chính thức của sách.');
mk('b',T10,'<div class="ztaibkptitle" style="margin-bottom:6px">找钱 (Thối tiền) – 补充生词</div>'+VG+'<div class="note" style="margin-bottom:8px">Chạm vào chỗ trống ①–⑧ để xem đáp án.</div><button class="chip" id="ra" style="margin-bottom:8px">Hiện tất cả đáp án</button>','Đáp án ①–⑧ ở trên do "bạn tui" tự điền theo ngữ cảnh, sách không in đáp án. <br />Đáp án sách; （1）了（2）把（3）在（4）来（5）了（6）把（7）成（8）来');
document.querySelectorAll('.bl').forEach(b=>b.onclick=e=>{e.stopPropagation();const on=b.classList.toggle('on');b.textContent=b.dataset.n+(on?b.dataset.a:'＿＿')});
document.getElementById('ra').onclick=function(){const on=this.classList.toggle('on');document.querySelectorAll('.bl').forEach(b=>{b.classList.toggle('on',on);b.textContent=b.dataset.n+(on?b.dataset.a:'＿＿')})};
mk('c',T11);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button,.pane').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on')});
</script>
