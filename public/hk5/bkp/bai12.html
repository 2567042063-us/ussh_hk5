<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="box">
<h1>📖 Bài khoá phụ - Bài 12 - trang </h1>
<div class="tabs" id="tabs">
<button class="on" data-t="a">7. Hội thoại</button><button data-t="b">8. Đọc hiểu</button><button data-t="c">Ngữ pháp</button>
</div>
<div class="pane on" id="a"></div>
<div class="pane" id="b"></div>
<div class="pane" id="c"></div>
</div>
<script>
const T7=[["<b>(1) 换零钱</b>", "Huàn língqián", "Đổi tiền lẻ"], ["<span class=\"spk\">张东：</span>麻烦您给我换成零钱。", "Zhāng Dōng: Máfan nín gěi wǒ huàn chéng língqián.", "Trương Đông: Phiền chị đổi giúp tôi thành tiền lẻ."], ["<span class=\"spk\">店员：</span>换成多少一张的？", "Diànyuán: Huàn chéng duōshao yì zhāng de?", "Nhân viên: Đổi thành tờ bao nhiêu ạ?"], ["<span class=\"spk\">张东：</span>换成十块一张的就行。", "Zhāng Dōng: Huàn chéng shí kuài yì zhāng de jiù xíng.", "Trương Đông: Đổi thành tờ 10 tệ là được."], ["<span class=\"spk\">店员：</span>给您。请数数。", "Diànyuán: Gěi nín. Qǐng shǔshu.", "Nhân viên: Của anh đây. Mời anh đếm lại."], ["<span class=\"spk\">张东：</span>对。谢谢您了！", "Zhāng Dōng: Duì. Xièxie nín le!", "Trương Đông: Đúng rồi. Cảm ơn chị!"], ["<b>(2) 取印章</b>", "Qǔ yìnzhāng", "Nhận con dấu"], ["<span class=\"spk\">山本：</span>请问，我的印章（yìnzhāng，seal）刻（kè，to carve）好了没有？", "Shānběn: Qǐngwèn, wǒ de yìnzhāng kè hǎo le méiyǒu?", "Yamamoto: Xin hỏi, con dấu của tôi khắc xong chưa?"], ["<span class=\"spk\">营业员：</span>刻好了，你看看吧。", "Yíngyèyuán: Kè hǎo le, nǐ kànkan ba.", "Nhân viên: Khắc xong rồi, bạn xem thử đi."], ["<span class=\"spk\">山本：</span>这就是篆字（zhuànzì，seal character）吗？", "Shānběn: Zhè jiù shì zhuànzì ma?", "Yamamoto: Đây chính là chữ triện ạ?"], ["<span class=\"spk\">营业员：</span>对。你看，“山本幸子”。", "Yíngyèyuán: Duì. Nǐ kàn, “Shānběn Xìngzǐ”.", "Nhân viên: Đúng. Bạn xem, “Yamamoto Sachiko”."], ["<span class=\"spk\">山本：</span>啊，太好了！", "Shānběn: À, tài hǎo le!", "Yamamoto: Ôi, tuyệt quá!"]],T8=[["从前，有一个人丢了一把斧子。他怀疑自己的斧子是邻居的儿子偷走的。", "Cóngqián, yǒu yí ge rén diū le yì bǎ fǔzi. Tā huáiyí zìjǐ de fǔzi shì línjū de érzi tōu zǒu de.", "Ngày xưa, có một người mất một chiếc rìu. Ông nghi cái rìu của mình là do con trai nhà hàng xóm lấy trộm."], ["于是，他就注意邻居儿子的一举一动、一言一行。他觉得这个孩子走路的样子跟小偷儿一样，说话跟小偷儿一样，脸上的表情也跟小偷儿一样，他的一言一行、一举一动都像是偷斧子的。", "Yúshì, tā jiù zhùyì línjū érzi de yì jǔ yí dòng, yì yán yì xíng. Tā juéde zhè ge háizi zǒulù de yàngzi gēn xiǎotōur yíyàng, shuōhuà gēn xiǎotōur yíyàng, liǎn shang de biǎoqíng yě gēn xiǎotōur yíyàng, tā de yì yán yì xíng, yì jǔ yí dòng dōu xiàng shì tōu fǔzi de.", "Thế là ông để ý từng cử chỉ, lời nói việc làm của con trai hàng xóm. Ông thấy dáng đi, cách nói và nét mặt của đứa trẻ đều giống kẻ trộm, mọi hành vi của nó đều như người trộm rìu."], ["后来，丢斧子的人找到了自己的斧子，原来是他到山上去砍柴时，丢在山上了。", "Hòulái, diū fǔzi de rén zhǎodào le zìjǐ de fǔzi, yuánlái shì tā dào shān shang qù kǎn chái shí, diū zài shān shang le.", "Sau đó, người mất rìu tìm thấy rìu của mình, hóa ra là lúc lên núi chặt củi ông đã làm rơi trên núi."], ["找到斧子以后，他再看邻居的儿子，觉得他走路的样子跟小偷儿不一样，说话的样子也跟小偷儿不一样，他的一言一行、一举一动都不像小偷儿了。", "Zhǎodào fǔzi yǐhòu, tā zài kàn línjū de érzi, juéde tā zǒulù de yàngzi gēn xiǎotōur bù yíyàng, shuōhuà de yàngzi yě gēn xiǎotōur bù yíyàng, tā de yì yán yì xíng, yì jǔ yí dòng dōu bú xiàng xiǎotōur le.", "Tìm thấy rìu rồi, ông nhìn lại con trai hàng xóm, thấy dáng đi không giống kẻ trộm, cách nói cũng không giống, mọi hành vi đều không còn giống kẻ trộm nữa."], ["<b>读后回答问题</b>", "Dú hòu huídá wèntí", "Đọc xong trả lời câu hỏi"], ["(1)丢斧子的人为什么怀疑自己的斧子是邻居的儿子偷走的？", "(1) Diū fǔzi de rén wèi shénme huáiyí zìjǐ de fǔzi shì línjū de érzi tōu zǒu de?", "(1) Tại sao người mất rìu nghi con trai hàng xóm lấy trộm?", ["因为他觉得邻居儿子走路的样子、说话和脸上的表情都跟小偷儿一样。", "Yīnwèi tā juéde línjū érzi zǒulù de yàngzi, shuōhuà hé liǎn shang de biǎoqíng dōu gēn xiǎotōur yíyàng.", "Vì ông thấy dáng đi, cách nói và nét mặt của cậu bé đều giống kẻ trộm."]], ["(2)斧子后来在哪儿找到了？", "(2) Fǔzi hòulái zài nǎr zhǎodào le?", "(2) Sau này tìm thấy rìu ở đâu?", ["在山上找到的。他去山上砍柴时，把斧子丢在山上了。", "Zài shān shang zhǎodào de. Tā qù shān shang kǎn chái shí, bǎ fǔzi diū zài shān shang le.", "Tìm thấy trên núi. Lúc lên núi chặt củi, ông đã làm rơi rìu ở đó."]], ["(3)找到斧子以后，邻居的儿子为什么又不像小偷儿了？", "(3) Zhǎodào fǔzi yǐhòu, línjū de érzi wèi shénme yòu bú xiàng xiǎotōur le?", "(3) Tìm thấy rìu rồi, sao con trai hàng xóm lại không giống kẻ trộm nữa?", ["因为他知道斧子是自己丢的，不是别人偷的，不再怀疑邻居的儿子了。", "Yīnwèi tā zhīdào fǔzi shì zìjǐ diū de, bú shì biéren tōu de, bú zài huáiyí línjū de érzi le.", "Vì ông biết rìu do mình đánh rơi chứ không ai trộm, nên không còn nghi ngờ cậu bé nữa."]], ["(4)这个故事（gùshi，story）说明（shuōmíng，to show）了什么？", "(4) Zhè ge gùshi shuōmíng le shénme?", "(4) Câu chuyện này cho thấy điều gì?", ["说明人一旦怀疑别人，就会觉得他做什么都可疑，不能随便怀疑别人。", "Shuōmíng rén yídàn huáiyí biéren, jiù huì juéde tā zuò shénme dōu kěyí, bù néng suíbiàn huáiyí biéren.", "Cho thấy khi đã nghi ngờ ai thì nhìn việc gì họ làm cũng thấy đáng ngờ; không nên tùy tiện nghi oan người khác."]]],G=[["1. Cấu trúc nhấn mạnh “是……的”", "Dùng để nhấn mạnh thời gian, địa điểm, cách thức hoặc chủ thể của một hành động đã xảy ra trong quá khứ.", [["他怀疑自己的斧子<b>是</b>邻居的儿子偷走<b>的</b>。", "Nhấn mạnh chủ thể: “Cái rìu là do con trai người hàng xóm lấy trộm.”"], ["原来<b>是</b>他到山上去砍柴时，丢在山上了。", "Nhấn mạnh hoàn cảnh/thời gian/địa điểm: “Hóa ra là khi lên núi chặt củi thì đã làm rơi trên núi.”"]], "⚠ Lưu ý: câu thứ hai trong sách không có chữ 的 ở cuối (…丢在山上了), nên đây là “原来是……” + 了 (hóa ra là…, chỉ nguyên nhân/hoàn cảnh), gần nghĩa với 是……的 chứ không phải 是……的 đầy đủ. Chỉ câu đầu là 是……的 chuẩn."], ["2. So sánh “跟 / 和 …… 一样” (giống như…)", "Cấu trúc: A + 跟/和 + B + (tính từ) + 一样. Dùng để so sánh sự tương đồng giữa hai sự vật, hiện tượng.", [["走路的样子<b>跟</b>小偷儿<b>一样</b>", "Dáng đi giống hệt kẻ trộm."], ["说话<b>跟</b>小偷儿<b>一样</b>", "Cách nói chuyện giống hệt kẻ trộm."], ["脸上的表情也<b>跟</b>小偷儿<b>一样</b>", "Biểu cảm trên mặt cũng giống hệt kẻ trộm."]], ""], ["3. So sánh phủ định “跟 / 和 …… 不一样”", "Thêm 不 trước 一样: A + 跟/和 + B + 不一样 = A không giống B.", [["他走路的样子<b>跟</b>小偷儿<b>不一样</b>", "Dáng đi của cậu ta không giống kẻ trộm."], ["说话的样子也<b>跟</b>小偷儿<b>不一样</b>", "Cách nói chuyện cũng không giống kẻ trộm."]], ""], ["4. Trợ từ động thái “了”", "Trong bài, 了 có 2 chức năng chính.", [["丢<b>了</b>一把斧子 · 找到<b>了</b>自己的斧子", "了 sau động từ: hành động đã hoàn thành (mất một chiếc rìu; đã tìm thấy rìu của mình)."], ["他的一言一行、一举一动都不像小偷儿<b>了</b>", "了 cuối câu: thay đổi trạng thái/nhận thức (không còn giống kẻ trộm nữa, khác với trước đây)."]], ""], ["5. Cụm cố định (thành ngữ 4 chữ)", "Hai cụm đi song song, làm tân ngữ (sau 注意) hoặc chủ ngữ của câu.", [["<b>一举一动</b> (yì jǔ yí dòng)", "Từng cử chỉ, từng hành động nhỏ."], ["<b>一言一行</b> (yì yán yì xíng)", "Từng lời nói, từng việc làm."], ["他就注意邻居儿子的一举一动、一言一行", "Làm tân ngữ của 注意."], ["他的一言一行、一举一动都像是偷斧子的", "Làm chủ ngữ của câu."]], ""]];
const VG="<div class=\"vg\"><div><b>从前</b>cóngqián · ngày xưa</div><div><b>斧子</b>fǔzi · cái rìu</div><div><b>怀疑</b>huáiyí · nghi ngờ</div><div><b>邻居</b>línjū · hàng xóm</div><div><b>偷</b>tōu · trộm</div><div><b>举动</b>jǔdòng · cử chỉ, hành vi</div><div><b>言行</b>yánxíng · lời nói và việc làm</div><div><b>样子</b>yàngzi · dáng vẻ</div><div><b>小偷(儿)</b>xiǎotōu(r) · kẻ trộm</div><div><b>表情</b>biǎoqíng · nét mặt</div><div><b>原来</b>yuánlái · hóa ra</div><div><b>砍柴</b>kǎn chái · chặt củi</div></div>";
function row(r){const a=r[3];return '<div class="s"><div class="h">'+r[0]+'</div><div class="p">'+r[1]+'</div><div class="v">'+r[2]+'</div>'+(a?'<button class="chip mini">Gợi ý đáp án</button><div class="a"><div class="h">'+a[0]+'</div><div class="p">'+a[1]+'</div><div class="v">'+a[2]+'</div></div>':'')+'</div>'}
function mk(id,arr,pre,post){const p=document.getElementById(id);
p.innerHTML=(pre||'')+'<div class="tools"><button class="chip" data-k="showp">Pinyin</button><button class="chip" data-k="showv">Nghĩa</button></div><div class="list">'+arr.map(row).join('')+'</div><div class="note" style="margin-top:8px">'+(post||'Chạm vào câu để xem pinyin và nghĩa.')+'</div>';
p.querySelectorAll('.s').forEach(s=>s.onclick=()=>{const on=!s.classList.contains('sp');s.classList.toggle('sp',on);s.classList.toggle('sv',on)});
p.querySelectorAll('.mini').forEach(b=>b.onclick=e=>{e.stopPropagation();b.parentNode.classList.toggle('sa')});
p.querySelectorAll('.tools .chip').forEach(c=>c.onclick=()=>{c.classList.toggle('on');p.classList.toggle(c.dataset.k)})}
mk('a',T7);
mk('b',T8,'<div class="note" style="margin-bottom:6px">丢了斧子以后 (Sau khi mất rìu) – 补充生词</div>'+VG,'Đáp án các câu hỏi là gợi ý tự soạn, không phải đáp án chính thức của sách.');
document.getElementById('c').innerHTML=G.map(g=>'<div class="g"><b>'+g[0]+'</b><div class="d">'+g[1]+'</div>'+g[2].map(e=>'<div class="ex">'+e[0]+'</div><small>'+e[1]+'</small>').join('')+(g[3]?'<div class="w">'+g[3]+'</div>':'')+'</div>').join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button,.pane').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on')});
</script>
</body>
</html>
